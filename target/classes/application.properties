# Nombre de la aplicación Spring Boot
spring.application.name=sistema-examenes-backend

# Conexión a MySQL. Se puede sobrescribir con variables de entorno (DB_URL, DB_USER, DB_PASSWORD)
# para no guardar credenciales en el repositorio.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sistema_examenes?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Estrategia de actualización del esquema (update, create, validate...)
spring.jpa.hibernate.ddl-auto=update

# Mostrar y formatear las sentencias SQL en la consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Evita consultas a la base de datos durante el renderizado de la respuesta
spring.jpa.open-in-view=false
